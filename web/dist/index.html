<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>pektino · 媒体库</title>
    <link rel="icon" href="/api/logo" />
    <script>
      try {
        const theme = localStorage.getItem('pektino.theme') || 'dark';
        document.documentElement.classList.toggle('dark', theme !== 'light');
        document.documentElement.classList.toggle('light', theme === 'light');
      } catch (e) {}
    </script>
    <style>:root{--boot-bg:#080c11;--boot-panel:#101820;--boot-line:#22303d;--boot-text:#e9f0f7;--boot-dim:#8d9bac}html.light{--boot-bg:#eef3f8;--boot-panel:#fff;--boot-line:#d8e2ec;--boot-text:#18232f;--boot-dim:#5c6b7c}html,body{background:var(--boot-bg);min-height:100%;color:var(--boot-text);margin:0}#root{min-height:100vh}.boot{background:var(--boot-bg);grid-template-columns:216px minmax(0,1fr);min-height:100vh;font-family:Inter,Segoe UI,Microsoft YaHei,system-ui,sans-serif;display:grid}.boot aside{border-right:1px solid var(--boot-line);background:var(--boot-panel);padding:18px 14px}.boot-brand{align-items:center;gap:10px;margin-bottom:26px;display:flex}.boot-mark{background:url(/api/logo) 50%/cover no-repeat;border-radius:10px;width:34px;height:34px}.boot-line{background:color-mix(in srgb, var(--boot-dim) 18%, transparent);border-radius:5px;height:9px}.boot-nav{background:color-mix(in srgb, var(--boot-dim) 8%, transparent);border-radius:10px;height:175px;margin-top:18px}.boot main{padding:26px 30px}.boot-head{height:58px;margin-bottom:22px}.boot-kpis{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px;display:grid}.boot-kpi{border:1px solid var(--boot-line);background:var(--boot-panel);border-radius:12px;height:68px}.boot-table{border:1px solid var(--boot-line);background:var(--boot-panel);border-radius:14px;height:390px}@keyframes bootpulse{0%,to{opacity:.45}50%{opacity:.8}}.boot-line,.boot-nav,.boot-kpi,.boot-table{animation:1.4s ease-in-out infinite bootpulse}@media (width<=980px){.boot{grid-template-columns:64px 1fr}.boot aside{padding:14px 10px}.boot-kpis{grid-template-columns:repeat(3,1fr)}}</style>
    <script type="module" crossorigin src="/assets/index-CEX0jp-p.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CFWR6Ua7.css">
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true">
        <aside>
          <div class="boot-brand"><div class="boot-mark"></div><div class="boot-line" style="width:86px"></div></div>
          <div class="boot-line" style="width:44px;margin-bottom:8px"></div>
          <div class="boot-nav"></div>
        </aside>
        <main>
          <div class="boot-head"><div class="boot-line" style="width:180px;height:16px;margin-bottom:10px"></div><div class="boot-line" style="width:260px"></div></div>
          <div class="boot-kpis"><div class="boot-kpi"></div><div class="boot-kpi"></div><div class="boot-kpi"></div><div class="boot-kpi"></div><div class="boot-kpi"></div><div class="boot-kpi"></div><div class="boot-kpi"></div></div>
          <div class="boot-table"></div>
        </main>
      </div>
    </div>
  </body>
</html>
